[package]
name = "ivy-host-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "host-scheduler"
path = "../../../tests/rust/host-scheduler.rs"

[[test]]
name = "host-paths"
path = "../../../tests/rust/host-paths.rs"

[[test]]
name = "host-windows-arguments"
path = "../../../tests/rust/host-windows-arguments.rs"

[[test]]
name = "host-process-output"
path = "../../../tests/rust/host-process-output.rs"

[[test]]
name = "host-process-output-node"
path = "../../../tests/rust/host-process-output-node.rs"

[[test]]
name = "host-process"
path = "../../../tests/rust/host-process.rs"

[[test]]
name = "host-package-requirements"
path = "../../../tests/rust/host-package-requirements.rs"

[[test]]
name = "host-defaults"
path = "../../../tests/rust/host-defaults.rs"

[[test]]
name = "host-logs"
path = "../../../tests/rust/host-logs.rs"

[dependencies]
ivy-contracts.workspace = true
ivy-store.workspace = true
ivy-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
futures-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[[test]]
name = "host-build-identity"
path = "../../../tests/rust/host-build-identity.rs"
