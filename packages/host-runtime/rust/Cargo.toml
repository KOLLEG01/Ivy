[dependencies]
async-compression.workspace = true
base64.workspace = true
reqwest.workspace = true
flate2.workspace = true
tar.workspace = true
ivy-contracts.workspace = true
ivy-store.workspace = true
ivy-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tokio-tungstenite.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
url.workspace = true
futures-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

