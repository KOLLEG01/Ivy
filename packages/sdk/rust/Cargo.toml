[package]
name = "ivy-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ivy-contracts.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
rustls.workspace = true
tower-service.workspace = true
futures-util.workspace = true
uuid.workspace = true
serde_json.workspace = true
chrono.workspace = true
jiff-tzdb.workspace = true
tz-rs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

