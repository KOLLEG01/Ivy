[workspace]
resolver = "3"
members = ["packages/contracts/rust", "packages/store", "packages/sdk/rust", "packages/host-runtime/rust", "packages/cli/rust"]

[workspace.package]
version = "0.2.40"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
ivy-contracts = { path = "packages/contracts/rust" }
ivy-store = { path = "packages/store" }
ivy-sdk = { path = "packages/sdk/rust" }
ivy-host-runtime = { path = "packages/host-runtime/rust" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
getrandom = "=0.4.3"
subtle = "=2.6.1"
ryu-js = "=1.0.3"
url = "=2.5.8"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal", "fs"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json", "multipart"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "functions", "hooks", "limits"] }
uuid = { version = "=1.28.0", features = ["v4"] }
chrono = "=0.4.45"
iana-time-zone = "=0.1.65"
chrono-tz = "=0.10.4"
jiff-tzdb = "=0.1.7"
tz-rs = "=0.7.3"
futures-util = { version = "=0.3.34", features = ["sink"] }
base64 = "=0.23.1"
regex = "=1.13.1"
regress = { version = "=0.12.0", features = ["utf16"] }
windows-sys = "=0.61.2"
libc = "=0.2.191"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rsipstack = { version = "=0.7.4", default-features = false, features = ["platform-tokio", "rustls", "srv_lookup"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"

async-compression = { version = "=0.4.51", default-features = false, features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
