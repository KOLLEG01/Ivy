[package]
name = "ivy-dashboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ivy-dashboards"
path = "src/main.rs"
required-features = ["browser"]

[features]
default = ["browser"]
browser = ["dep:chromiumoxide"]

[dependencies]
ivy-contracts.workspace = true
ivy-sdk.workspace = true
ivy-host-runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
base64.workspace = true
uuid.workspace = true
sha2.workspace = true
reqwest.workspace = true
chrono.workspace = true
subtle = "=2.6.1"
chromiumoxide = { version = "=0.9.1", optional = true }
png = "=0.18.1"

[dev-dependencies]
tokio-tungstenite.workspace = true

[[test]]
name = "dashboards-raster"
path = "../../../tests/rust/dashboards-raster.rs"

[[test]]
name = "dashboards-browser-path"
path = "../../../tests/rust/dashboards-browser-path.rs"

[[test]]
name = "dashboards-png"
path = "../../../tests/rust/dashboards-png.rs"

[[test]]
name = "dashboards-document"
path = "../../../tests/rust/dashboards-document.rs"

[[test]]
name = "dashboards-renderer"
path = "../../../tests/rust/dashboards-renderer.rs"
required-features = ["browser"]

[[test]]
name = "dashboards-runtime"
path = "../../../tests/rust/dashboards-runtime.rs"
required-features = ["browser"]

[[test]]
name = "dashboards-sources"
path = "../../../tests/rust/dashboards-sources.rs"

[[test]]
name = "dashboards-validation"
path = "../../../tests/rust/dashboards-validation.rs"

[[test]]
name = "dashboards-store"
path = "../../../tests/rust/dashboards-store.rs"

[[test]]
name = "dashboards-handlers"
path = "../../../tests/rust/dashboards-handlers.rs"

[[test]]
name = "dashboards-browser"
path = "../../../tests/rust/dashboards-browser.rs"
required-features = ["browser"]
