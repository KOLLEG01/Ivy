[package]
name = "ivy-chat-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ivy-contracts.workspace = true
ivy-host-runtime.workspace = true
ivy-sdk.workspace = true
ivy-store.workspace = true
uuid.workspace = true
base64.workspace = true
rusqlite.workspace = true
tokio.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
ogg = "=0.9.2"
opus = "=0.4.0"
bytes = "=1.12.1"
async-trait = "=0.1.92"
rand = "=0.10.3"
infer = "=0.22.0"
wacore = { version = "=0.7.0", default-features = false, features = ["legacy-session-interop"] }
waproto = "=0.7.0"
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-native", "tokio-transport", "ureq-client", "legacy-session-interop"] }
wacore-libsignal = { version = "=0.7.0", default-features = false, features = ["legacy-session-interop"] }

[dev-dependencies]
flate2.workspace = true

