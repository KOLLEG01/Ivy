[package]
name = "ivy-agent-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ivy-contracts.workspace = true
ivy-store.workspace = true
ivy-sdk.workspace = true
ivy-host-runtime.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid.workspace = true
base64.workspace = true
regex.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[[bin]]
name = "ivy-agent-manager"
path = "src/main.rs"

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[test]]
name = "agent-state"
path = "../../../tests/rust/agent-state.rs"

[[test]]
name = "agent-journal"
path = "../../../tests/rust/agent-journal.rs"

[[test]]
name = "agent-catalog-state"
path = "../../../tests/rust/agent-catalog-state.rs"

