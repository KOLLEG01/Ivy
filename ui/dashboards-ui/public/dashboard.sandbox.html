<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dashboard sandbox</title>
  </head>
  <body>
    <script>
      window.addEventListener(
        "message",
        (event) => {
          if (
            event.source !== parent ||
            event.data?.type !== "document" ||
            typeof event.data.html !== "string"
          )
            return;
          document.open();
          document.write(event.data.html);
          document.close();
        },
        { once: true },
      );
      parent.postMessage({ type: "sandbox-ready" }, "*");
    </script>
  </body>
</html>
